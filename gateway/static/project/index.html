<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目审核台</title>
  <style>
    body { max-width: 920px; margin: 0 auto; padding: 24px; background: #f5f7f8; color: #18212a; font: 16px system-ui, sans-serif; }
    section { margin: 16px 0; padding: 16px; border: 1px solid #d7dde3; border-radius: 6px; background: #fff; }
    h1, h2 { margin-top: 0; } article { padding: 12px 0; border-top: 1px solid #e4e8eb; }
    button { margin-right: 8px; padding: 6px 10px; border: 1px solid #aab5be; border-radius: 4px; background: #fff; }
    .review-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .review-controls button { margin-right: 0; }
    .muted { color: #687580; } .error { color: #a52a2a; }
  </style>
</head>
<body>
  <h1>项目审核台</h1>
  <section id="status"><h2>状态</h2><p class="muted">加载中...</p></section>
  <section id="candidates"><h2>待确认候选</h2><p class="muted">加载中...</p></section>
  <section id="runtime"><h2>设备/运行状态</h2><p class="muted">等待状态刷新。</p></section>
  <script>
    (() => {
      const request = (path, options) => fetch(path, { credentials: "same-origin", ...options }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      });
      const escape = (value) => String(value ?? "").replace(/[&<>\"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[char]);
      const error = (value) => { document.querySelector("#runtime").innerHTML = `<h2>设备/运行状态</h2><p class="error">${escape(value.message)}</p>`; };
      const unlockControls = (controls) => {
        controls.dataset.submitting = "false";
        controls.removeAttribute("aria-busy");
        controls.querySelectorAll("button").forEach((button) => { button.disabled = false; });
      };
      const showReload = (controls, value) => {
        unlockControls(controls);
        controls.replaceChildren();
        const reload = document.createElement("button"); reload.textContent = "重新加载";
        reload.addEventListener("click", () => {
          if (controls.dataset.submitting === "true") return;
          controls.dataset.submitting = "true";
          controls.setAttribute("aria-busy", "true");
          reload.disabled = true;
          load().catch((loadError) => { unlockControls(controls); error(loadError); });
        });
        controls.appendChild(reload);
        reload.focus();
        error(value);
      };
      const review = (candidate, action, controls) => {
        if (controls.dataset.submitting === "true") return;
        controls.dataset.submitting = "true";
        controls.setAttribute("aria-busy", "true");
        controls.querySelectorAll("button").forEach((button) => { button.disabled = true; });
        request(`/api/conflicts/${encodeURIComponent(candidate.candidate_id)}/review`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, change_reason: action === "accept" ? "审核台确认" : "审核台拒绝" })
        }).then(
          () => load().catch((value) => showReload(controls, value)),
          (value) => { unlockControls(controls); error(value); }
        );
      };
      const reviewControls = (candidate) => {
        const controls = document.createElement("div");
        controls.className = "review-controls";
        controls.setAttribute("role", "group");
        controls.setAttribute("aria-label", "候选审核操作");
        const renderActions = (focusAction) => {
          controls.replaceChildren();
          controls.dataset.submitting = "false";
          controls.removeAttribute("aria-busy");
          [["accept", "接受"], ["reject", "拒绝"]].forEach(([action, label]) => {
            const button = document.createElement("button"); button.textContent = label;
            button.addEventListener("click", () => confirmReview(candidate, action, label, controls));
            controls.appendChild(button);
            if (action === focusAction) button.focus();
          });
        };
        const confirmReview = (item, action, label, root) => {
          root.replaceChildren();
          const prompt = document.createElement("span"); prompt.textContent = `确认${label}此候选？`;
          const submit = document.createElement("button"); submit.textContent = `确认${label}`;
          submit.addEventListener("click", () => review(item, action, root));
          const cancel = document.createElement("button"); cancel.textContent = "取消";
          cancel.addEventListener("click", () => renderActions(action));
          root.append(prompt, submit, cancel);
          submit.focus();
        };
        renderActions();
        return controls;
      };
      const candidates = (items) => {
        const root = document.querySelector("#candidates"); root.innerHTML = "<h2>待确认候选</h2>";
        const pending = items.filter((item) => item.status === "proposed");
        if (!pending.length) { root.insertAdjacentHTML("beforeend", "<p class=\"muted\">暂无待确认项</p>"); return; }
        pending.forEach((item) => {
          const card = document.createElement("article");
          card.textContent = `${item.active_text} -> ${item.proposed_text}：${item.reason}`;
          card.appendChild(reviewControls(item));
          root.appendChild(card);
        });
      };
      const status = (value) => { document.querySelector("#status").innerHTML = `<h2>状态</h2><p>${escape(value.project_name)}：${escape(value.source_count)} 个来源，${escape(value.active_decision_count)} 项有效决策，时钟 ${escape(value.clock_status)}</p>`; };
      const sessionAction = (path, controls) => {
        if (controls.dataset.submitting === "true") return;
        controls.dataset.submitting = "true";
        controls.setAttribute("aria-busy", "true");
        controls.querySelectorAll("button").forEach((button) => { button.disabled = true; });
        request(path, { method: "POST" }).then(() => request("/api/session")).then(
          (value) => sessionStatus(value),
          (value) => { unlockControls(controls); error(value); }
        );
      };
      const sessionStatus = (value) => {
        const root = document.querySelector("#runtime");
        const title = document.createElement("h2"); title.textContent = "会议会话";
        const description = document.createElement("p");
        const labels = { active: "进行中", attention_required: "等待人工处理", stopped: "已结束", expired: "已到期", inactive: "未开始", failed: "状态不可用" };
        description.textContent = labels[value.status] || "状态不可用";
        if (value.status === "active" && value.expires_at) description.textContent += `，结束时间 ${value.expires_at}`;
        if (value.error_type) description.textContent += `，上轮 ${value.error_type}`;
        const controls = document.createElement("div"); controls.className = "review-controls";
        controls.setAttribute("role", "group"); controls.setAttribute("aria-label", "会议会话操作");
        const action = (label, path) => {
          const button = document.createElement("button"); button.textContent = label;
          button.addEventListener("click", () => sessionAction(path, controls));
          controls.appendChild(button);
        };
        if (["inactive", "stopped", "expired"].includes(value.status)) action("开始会话", "/api/session/start");
        if (value.status === "active") action("结束会话", "/api/session/stop");
        if (value.status === "attention_required") {
          action("恢复续期", "/api/session/resume");
          action("结束会话", "/api/session/stop");
        }
        root.replaceChildren(title, description, controls);
      };
      const load = () => Promise.all([request("/api/summary"), request("/api/conflicts"), request("/api/session")]).then(([summary, conflicts, sessionValue]) => { status(summary); candidates(conflicts.conflicts || []); sessionStatus(sessionValue); });
      load().catch(error);
    })();
  </script>
</body>
</html>
