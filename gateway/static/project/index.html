<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目审核台</title>
  <style>
    body { max-width: 920px; margin: 0 auto; padding: 24px; background: #f5f7f8; color: #18212a; font: 16px system-ui, sans-serif; }
    section { margin: 16px 0; padding: 16px; border: 1px solid #d7dde3; border-radius: 6px; background: #fff; }
    h1, h2 { margin-top: 0; } article { padding: 12px 0; border-top: 1px solid #e4e8eb; }
    button { margin-right: 8px; padding: 6px 10px; border: 1px solid #aab5be; border-radius: 4px; background: #fff; }
    .muted { color: #687580; } .error { color: #a52a2a; }
  </style>
</head>
<body>
  <h1>项目审核台</h1>
  <section id="status"><h2>状态</h2><p class="muted">加载中...</p></section>
  <section id="candidates"><h2>待确认候选</h2><p class="muted">加载中...</p></section>
  <section id="runtime"><h2>设备/运行状态</h2><p class="muted">等待状态刷新。</p></section>
  <script>
    (() => {
      const request = (path, options) => fetch(path, { credentials: "same-origin", ...options }).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      });
      const escape = (value) => String(value ?? "").replace(/[&<>\"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[char]);
      const error = (value) => { document.querySelector("#runtime").innerHTML = `<h2>设备/运行状态</h2><p class="error">${escape(value.message)}</p>`; };
      const review = (candidate, action) => {
        if (!window.confirm(action === "accept" ? "确认接受此候选？" : "确认拒绝此候选？")) return;
        request(`/api/conflicts/${encodeURIComponent(candidate.candidate_id)}/review`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, change_reason: action === "accept" ? "审核台确认" : "审核台拒绝" })
        }).then(load).catch(error);
      };
      const candidates = (items) => {
        const root = document.querySelector("#candidates"); root.innerHTML = "<h2>待确认候选</h2>";
        const pending = items.filter((item) => item.status === "proposed");
        if (!pending.length) { root.insertAdjacentHTML("beforeend", "<p class=\"muted\">暂无待确认项</p>"); return; }
        pending.forEach((item) => {
          const card = document.createElement("article");
          card.textContent = `${item.active_text} -> ${item.proposed_text}：${item.reason}`;
          [["accept", "接受"], ["reject", "拒绝"]].forEach(([action, label]) => {
            const button = document.createElement("button"); button.textContent = label;
            button.addEventListener("click", () => review(item, action)); card.appendChild(button);
          });
          root.appendChild(card);
        });
      };
      const status = (value) => { document.querySelector("#status").innerHTML = `<h2>状态</h2><p>${escape(value.project_name)}：${escape(value.source_count)} 个来源，${escape(value.active_decision_count)} 项有效决策，时钟 ${escape(value.clock_status)}</p>`; };
      const load = () => Promise.all([request("/api/summary"), request("/api/conflicts")]).then(([summary, conflicts]) => { status(summary); candidates(conflicts.conflicts || []); }).catch(error);
      load();
    })();
  </script>
</body>
</html>
