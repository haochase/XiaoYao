[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyao-companion-gateway"
version = "0.1.0"
description = "ESP32 voice companion gateway with Xiaozhi-compatible audio"
requires-python = ">=3.11"
dependencies = [
  "av>=16,<17",
  "fastapi>=0.115,<1",
  "lark-channel-sdk>=1.2,<2",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=tests/.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]
